<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>湖畔村庄 · 3D 场景 - Hedwig</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body {
            width: 100%; height: 100%;
            background: #0d1117;
            overflow: hidden;
            font-family: -apple-system, "Segoe UI", Roboto, "Microsoft YaHei", sans-serif;
        }
        #scene { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
        #hud {
            position: absolute; top: 0; left: 0; right: 0;
            display: flex; justify-content: space-between; align-items: center;
            padding: 10px 14px; pointer-events: none; z-index: 10;
        }
        #hud .info {
            color: #c9d1d9; font-size: 13px;
            background: rgba(13,17,23,.55); padding: 6px 12px; border-radius: 8px;
            backdrop-filter: blur(4px);
        }
        #hud .info a { color: #58a6ff; text-decoration: none; pointer-events: auto; }
        #quality { cursor: pointer; pointer-events: auto; }
        #status { color: #8b949e; }
        #status.loading { color: #d29922; }
        #status.ready { color: #3fb950; }
        #status.error { color: #f85149; }
        #hint {
            position: absolute; right: 16px; bottom: 20px;
            color: rgba(255,255,255,.6); font-size: 12px; text-align: right;
            z-index: 10; pointer-events: none; line-height: 1.8;
            text-shadow: 0 1px 2px rgba(0,0,0,.35);
        }
        #cover {
            position: absolute; inset: 0;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            background: linear-gradient(180deg, #10203a 0%, #1b3350 100%);
            z-index: 50; color: #e6edf3; gap: 14px; text-align: center; padding: 20px;
        }
        #cover h1 { font-size: 22px; font-weight: 600; }
        #cover p { color: #9fb3c8; font-size: 14px; max-width: 460px; line-height: 1.8; }
        .spinner {
            width: 40px; height: 40px; border: 3px solid #30363d;
            border-top-color: #58a6ff; border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        #err { color: #ff7b72; display: none; font-size: 12px; max-width: 90%; word-break: break-all; }
    </style>
</head>
<body>
    <canvas id="scene"></canvas>

    <div id="hud">
        <div class="info"><a href="/">← Hedwig</a></div>
        <div class="info"><span id="quality" title="点击切换画质"></span> · <span id="status">加载中...</span></div>
    </div>

    <div id="hint">
        鼠标拖动旋转视角<br>
        滚轮缩放 / 右键平移
    </div>

    <div id="cover">
        <h1>湖畔村庄</h1>
        <p>程序化湖光山色 + Kenney 风格化村庄，纯前端渲染。低性能设备会自动降低画质。</p>
        <div class="spinner"></div>
        <p id="progress">准备中...</p>
        <div id="err"></div>
    </div>

    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
        }
    }
    </script>
    <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

    // ===================================================================
    // 场景参数（与 tools/gen_terrain.mjs 保持一致）
    // ===================================================================
    const CFG = {
        seed: 20240517,
        size: 400,
        grid: 256,
        mountainHeight: 58,
        hills: [
            { x: -140, z: -70, r: 95, h: 26 },
            { x: -40, z: -140, r: 120, h: 30 },
            { x: 150, z: -90, r: 105, h: 24 },
            { x: 165, z: 120, r: 125, h: 18 },
            { x: -160, z: 130, r: 135, h: 16 },
            { x: -20, z: 150, r: 110, h: 14 }
        ],
        lake: { x: -58, z: 30, r: 54 },
        village: { x: 40, z: 22, r: 42, y: 5.5 },
        waterLevel: 2.2,
        H_MIN: -15,
        H_MAX: 95
    };
    const ASSETS = '/tscn2/assets';

    // ===================================================================
    // 画质分级
    // ===================================================================
    const params = new URLSearchParams(location.search);
    const isSmall = Math.min(innerWidth, innerHeight) < 520 ||
        /Mobi|Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
    let tier = params.get('q') || (isSmall ? 'low' : 'high');

    function qualityFromTier(t) {
        return t === 'low'
            ? { segs: 128, trees: 0.35, rocks: 0.5, shadows: false, pixelRatio: 1, antialias: false, shadowMap: 512 }
            : { segs: 256, trees: 1.0, rocks: 1.0, shadows: true, pixelRatio: Math.min(devicePixelRatio, 2), antialias: true, shadowMap: 2048 };
    }
    let Q = qualityFromTier(tier);

    const statusEl = document.getElementById('status');
    const qualityEl = document.getElementById('quality');
    const progressEl = document.getElementById('progress');
    const errEl = document.getElementById('err');
    const cover = document.getElementById('cover');
    function setStatus(t, c) { statusEl.textContent = t; statusEl.className = c || ''; }
    function setProgress(t) { progressEl.textContent = t; }
    function showError(e) {
        errEl.style.display = 'block';
        errEl.textContent = '加载失败: ' + (e && e.message ? e.message : e);
        cover.querySelector('.spinner').style.display = 'none';
        setStatus('加载失败', 'error');
    }
    qualityEl.textContent = tier === 'low' ? '低画质' : '高画质';

    // ===================================================================
    // 噪声与高度场
    // ===================================================================
    function hash2(ix, iz, seed) {
        let h = (ix * 374761393 + iz * 668265263 + seed * 5011) | 0;
        h = Math.imul(h ^ (h >>> 13), 1274126177);
        return ((h ^ (h >>> 16)) >>> 0) / 4294967296;
    }
    const smooth = t => t * t * (3 - 2 * t);
    function valueNoise(x, z, seed) {
        const ix = Math.floor(x), iz = Math.floor(z);
        const fx = x - ix, fz = z - iz;
        const a = hash2(ix, iz, seed), b = hash2(ix + 1, iz, seed);
        const c = hash2(ix, iz + 1, seed), d = hash2(ix + 1, iz + 1, seed);
        const u = smooth(fx), v = smooth(fz);
        return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v;
    }
    function fbm(x, z, seed, oct = 4) {
        let s = 0, amp = 0.5, f = 1, n = 0;
        for (let i = 0; i < oct; i++) { s += valueNoise(x * f, z * f, seed + i * 101) * amp; n += amp; amp *= 0.5; f *= 2.03; }
        return s / n;
    }
    function noiseHeightAt(x, z) {
        const nx = x / CFG.size, nz = z / CFG.size;
        let h = fbm(nx * 2.4 + 11.3, nz * 2.4 + 5.7, CFG.seed, 4) * 4.5;
        h += fbm(nx * 6.0 + 3.1, nz * 6.0 + 9.9, CFG.seed + 77, 3) * 2.0;
        h += fbm(nx * 13.0 + 1.7, nz * 13.0 + 4.3, CFG.seed + 200, 2) * 0.8;
        for (const hi of CFG.hills) {
            const d = Math.hypot(x - hi.x, z - hi.z) / hi.r;
            h += hi.h * Math.max(0, 1 - d * d) ** 1.6;
        }
        const mnt = smooth(Math.min(Math.max((-z - 60) / 190, 0), 1));
        const ridge = 1 - Math.abs(2 * fbm(nx * 2.2 + 21.0, nz * 2.2 + 4.0, CFG.seed + 555, 4) - 1);
        h += mnt * (ridge * ridge * CFG.mountainHeight * 0.75 + fbm(nx * 4 + 2, nz * 4 + 8, CFG.seed + 9, 3) * CFG.mountainHeight * 0.35);
        const dl = Math.hypot(x - CFG.lake.x, z - CFG.lake.z);
        const lakeT = smooth(Math.min(Math.max((dl - CFG.lake.r * 0.55) / (CFG.lake.r * 0.75), 0), 1));
        h = h * lakeT + (CFG.waterLevel - 4.0) * (1 - lakeT);
        const dv = Math.hypot(x - CFG.village.x, z - CFG.village.z);
        const vT = smooth(Math.min(Math.max((dv - CFG.village.r * 0.55) / 22, 0), 1));
        h = h * vT + CFG.village.y * (1 - vT);
        return h;
    }

    // 二进制高度图（优先），失败则回退到噪声
    let heightAt = noiseHeightAt;
    async function loadHeightmap() {
        try {
            const res = await fetch(`${ASSETS}/terrain.bin`);
            if (!res.ok) throw new Error('HTTP ' + res.status);
            const buf = new Uint16Array(await res.arrayBuffer());
            const N = CFG.grid;
            if (buf.length < N * N) throw new Error('heightmap too small');
            const step = CFG.size / (N - 1);
            heightAt = (x, z) => {
                const fx = (x + CFG.size / 2) / step, fz = (z + CFG.size / 2) / step;
                const ix = Math.max(0, Math.min(N - 2, Math.floor(fx)));
                const iz = Math.max(0, Math.min(N - 2, Math.floor(fz)));
                const tx = Math.max(0, Math.min(1, fx - ix)), tz = Math.max(0, Math.min(1, fz - iz));
                const s = (i, j) => buf[j * N + i] / 65535 * (CFG.H_MAX - CFG.H_MIN) + CFG.H_MIN;
                const a = s(ix, iz), b = s(ix + 1, iz), c = s(ix, iz + 1), d = s(ix + 1, iz + 1);
                return (a * (1 - tx) + b * tx) * (1 - tz) + (c * (1 - tx) + d * tx) * tz;
            };
            return 'binary';
        } catch (e) {
            console.warn('terrain.bin 不可用，改用内置噪声：', e.message);
            return 'noise';
        }
    }

    function slopeAt(x, z) {
        const e = 2.0, h = heightAt(x, z);
        return Math.max(
            Math.abs(heightAt(x + e, z) - h),
            Math.abs(heightAt(x, z + e) - h)
        ) / e;
    }
    function mulberry32(seed) {
        let s = seed >>> 0 || 1;
        return () => { s = (s + 0x6D2B79F5) | 0; let t = Math.imul(s ^ (s >>> 15), 1 | s); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
    }

    // ===================================================================
    // 渲染器 / 场景 / 相机
    // ===================================================================
    const canvas = document.getElementById('scene');
    const renderer = new THREE.WebGLRenderer({ canvas, antialias: Q.antialias, powerPreference: 'high-performance' });
    renderer.setPixelRatio(Q.pixelRatio);
    renderer.setSize(innerWidth, innerHeight);
    renderer.shadowMap.enabled = Q.shadows;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.02;
    renderer.outputColorSpace = THREE.SRGBColorSpace;

    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(45, innerWidth / innerHeight, 0.5, 2200);
    const SKY_TOP = 0x5b93d1, SKY_HORIZON = 0xbcd9f0;

    addEventListener('resize', () => {
        camera.aspect = innerWidth / innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(innerWidth, innerHeight);
    });

    // ===================================================================
    // 天空 / 光照
    // ===================================================================
    const SUN_DIR = new THREE.Vector3(0.46, 0.72, 0.52).normalize();

    function addSky() {
        const geo = new THREE.SphereGeometry(1000, 32, 16);
        const mat = new THREE.ShaderMaterial({
            side: THREE.BackSide, depthWrite: false,
            uniforms: {
                topColor: { value: new THREE.Color(SKY_TOP) },
                horizonColor: { value: new THREE.Color(SKY_HORIZON) },
                sunDir: { value: SUN_DIR.clone() },
                sunColor: { value: new THREE.Color(0xfff2d0) }
            },
            vertexShader: `varying vec3 vDir; void main(){ vDir = normalize(position); gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }`,
            fragmentShader: `
                uniform vec3 topColor, horizonColor, sunColor, sunDir;
                varying vec3 vDir;
                void main(){
                    float h = clamp(vDir.y, 0.0, 1.0);
                    vec3 col = mix(horizonColor, topColor, pow(h, 0.6));
                    float s = max(dot(normalize(vDir), normalize(sunDir)), 0.0);
                    col += sunColor * (pow(s, 420.0) * 1.1 + pow(s, 9.0) * 0.16);
                    gl_FragColor = vec4(col, 1.0);
                }`
        });
        scene.add(new THREE.Mesh(geo, mat));
    }

    let sun = null;
    function addLights() {
        scene.add(new THREE.HemisphereLight(0xcfe0f2, 0x4a5a3a, 0.85));
        sun = new THREE.DirectionalLight(0xfff3dd, 2.15);
        const v = CFG.village;
        sun.position.set(v.x + SUN_DIR.x * 220, SUN_DIR.y * 220, v.z + SUN_DIR.z * 220);
        sun.target.position.set(v.x, v.y, v.z);
        scene.add(sun, sun.target);
        if (Q.shadows) {
            sun.castShadow = true;
            sun.shadow.mapSize.set(Q.shadowMap, Q.shadowMap);
            const c = sun.shadow.camera;
            const half = 130;
            c.left = -half; c.right = half; c.top = half; c.bottom = -half;
            c.near = 40; c.far = 520;
            sun.shadow.bias = -0.0006;
            sun.shadow.normalBias = 0.6;
        }
    }

    // ===================================================================
    // 地形 / 水面
    // ===================================================================
    function buildTerrain() {
        const geo = new THREE.PlaneGeometry(CFG.size, CFG.size, Q.segs, Q.segs);
        geo.rotateX(-Math.PI / 2);
        const pos = geo.attributes.position;
        const colors = new Float32Array(pos.count * 3);
        const cGrass = new THREE.Color(0x6d9a4a), cGrass2 = new THREE.Color(0x557f3a);
        const cRock = new THREE.Color(0x9aa0a2), cSand = new THREE.Color(0xc9b184), cSnow = new THREE.Color(0xe8eef2);
        const tmp = new THREE.Color();
        for (let i = 0; i < pos.count; i++) {
            const x = pos.getX(i), z = pos.getZ(i);
            const h = heightAt(x, z);
            pos.setY(i, h);
            const sl = slopeAt(x, z);
            const n = fbm(x * 0.05 + 3, z * 0.05 + 7, CFG.seed + 31, 3);
            if (h < CFG.waterLevel + 0.35) tmp.copy(cSand);
            else {
                tmp.copy(cGrass).lerp(cGrass2, n);
                if (sl > 0.55) tmp.lerp(cRock, Math.min((sl - 0.55) * 1.6, 1));
                if (h > CFG.mountainHeight * 0.78) tmp.lerp(cSnow, Math.min((h - CFG.mountainHeight * 0.78) / (CFG.mountainHeight * 0.3), 1) * 0.9);
            }
            colors[i * 3] = tmp.r; colors[i * 3 + 1] = tmp.g; colors[i * 3 + 2] = tmp.b;
        }
        geo.setAttribute('color', new THREE.BufferAttribute(colors, 3));
        geo.computeVertexNormals();
        const mat = new THREE.MeshStandardMaterial({ vertexColors: true, roughness: 1, metalness: 0, flatShading: true });
        const mesh = new THREE.Mesh(geo, mat);
        mesh.name = 'Terrain';
        mesh.receiveShadow = Q.shadows;
        return mesh;
    }

    function buildWater() {
        const r = CFG.lake.r;
        const geo = new THREE.PlaneGeometry(r * 2.5, r * 2.5, 1, 1).rotateX(-Math.PI / 2);
        const mat = new THREE.MeshStandardMaterial({
            color: 0x4f9fd4, transparent: true, opacity: 0.85,
            roughness: 0.18, metalness: 0.15
        });
        const mesh = new THREE.Mesh(geo, mat);
        mesh.position.set(CFG.lake.x, CFG.waterLevel, CFG.lake.z);
        mesh.name = 'Water';
        return mesh;
    }

    // ===================================================================
    // 布局（与预览一致）
    // ===================================================================
    const V = CFG.village;

    function villageTiles() {
        const plaza = [], roads = [];
        const R = 3;
        for (let i = -R; i <= R; i++) for (let j = -R; j <= R; j++) {
            if (Math.abs(i) + Math.abs(j) > R + 1) continue;
            plaza.push([i, j, 0]);
        }
        for (let k = R + 1; k <= 9; k++) roads.push([0, -k, 0]);
        for (let k = R + 1; k <= 9; k++) roads.push([k, 3, 0]);
        for (let k = R + 1; k <= 9; k++) roads.push([-k, 4, 0]);
        for (let k = R + 1; k <= 10; k++) roads.push([2, k, 0]);
        return { plaza, roads };
    }
    const houses = [
        { model: 'building-sample-house-a', x: 0, z: -10, ry: 0 },
        { model: 'building-sample-house-b', x: 10.5, z: 3, ry: -Math.PI / 2 },
        { model: 'building-sample-house-c', x: -10.5, z: 4, ry: Math.PI / 2 },
        { model: 'building-sample-house-a', x: 2, z: 11.5, ry: Math.PI }
    ];
    const props = [
        { model: 'cart', x: -6.5, z: 7.5, ry: 0.5 },
        { model: 'stall', x: 6, z: 6.2, ry: 1.6 },
        { model: 'stall', x: 7.4, z: 5.6, ry: 1.6 },
        { model: 'lantern', x: -3.6, z: -3.6, ry: 0 },
        { model: 'lantern', x: 3.6, z: -3.6, ry: 0 },
        { model: 'lantern', x: 3.6, z: 3.6, ry: 0 },
        { model: 'lantern', x: -3.6, z: 3.6, ry: 0 },
        { model: 'pillar-wood', x: -14, z: 4, ry: 0 },
        { model: 'pillar-wood', x: -18, z: 4, ry: 0 }
    ];

    function scatter(cfgRng, count, opts) {
        const { minH = -1e9, maxH = 1e9, maxSlope = 1e9, region = null, avoid = [] } = opts || {};
        const pts = [];
        const half = CFG.size * 0.47;
        let guard = count * 60;
        while (pts.length < count && guard-- > 0) {
            let x, z;
            if (region) {
                const a = cfgRng() * Math.PI * 2, r = Math.sqrt(cfgRng()) * region.r;
                x = region.x + Math.cos(a) * r; z = region.z + Math.sin(a) * r;
            } else { x = (cfgRng() * 2 - 1) * half; z = (cfgRng() * 2 - 1) * half; }
            if (avoid.some(a => (x - a.x) ** 2 + (z - a.z) ** 2 < a.r * a.r)) continue;
            const h = heightAt(x, z);
            if (h < minH || h > maxH) continue;
            const sl = slopeAt(x, z);
            if (sl > maxSlope) continue;
            pts.push({ x, y: h, z, rx: cfgRng(), ry: cfgRng() * Math.PI * 2, rz: cfgRng() });
        }
        return pts;
    }
    function groves(rng, opts) {
        const { groves = 60, perGrove = 14, region, avoid = [], minH = CFG.waterLevel + 1, maxSlope = 1.35, spread = 15 } = opts;
        const pts = [];
        for (let g = 0; g < groves; g++) {
            const a = rng() * Math.PI * 2, r = Math.sqrt(rng()) * region.r;
            const cx = region.x + Math.cos(a) * r, cz = region.z + Math.sin(a) * r;
            if (avoid.some(av => (cx - av.x) ** 2 + (cz - av.z) ** 2 < av.r * av.r)) continue;
            if (heightAt(cx, cz) < minH) continue;
            const n = Math.round(perGrove * (0.5 + rng()));
            for (let k = 0; k < n; k++) {
                const ang = rng() * Math.PI * 2, rad = Math.sqrt(rng()) * spread;
                const x = cx + Math.cos(ang) * rad, z = cz + Math.sin(ang) * rad;
                if (avoid.some(av => (x - av.x) ** 2 + (z - av.z) ** 2 < av.r * av.r)) continue;
                const h = heightAt(x, z);
                if (h < minH) continue;
                if (slopeAt(x, z) > maxSlope) continue;
                pts.push({ x, y: h, z, rx: rng(), ry: rng() * Math.PI * 2, rz: rng() });
            }
        }
        return pts;
    }

    // 生成每个模型的所有摆放（世界矩阵 + 影子参数）
    function buildPlacements() {
        const rng = mulberry32(CFG.seed + 9);
        const avoid = [{ x: V.x, z: V.z, r: 24 }, { x: CFG.lake.x, z: CFG.lake.z, r: CFG.lake.r * 0.95 }];
        const P = {}; // model -> [{pos, ry, s}]
        const put = (model, x, y, z, ry = 0, s = 1) => {
            (P[model] = P[model] || []).push({ x, y, z, ry, s });
        };

        // 木地板广场 + 石板道路
        const tiles = villageTiles();
        for (const [i, j, ry] of tiles.plaza) put('planks', V.x + i, V.y + 0.04, V.z + j, ry);
        for (const [i, j, ry] of tiles.roads) put('road', V.x + i, V.y + 0.04, V.z + j, ry);
        // 房屋
        for (const h of houses) put(h.model, V.x + h.x, V.y, V.z + h.z, h.ry);
        // 喷泉
        put('fountain-round', V.x, V.y + 0.04, V.z, 0);
        // 道具与灯笼
        for (const p of props) put(p.model, V.x + p.x, V.y, V.z + p.z, p.ry);
        for (let k = 5; k <= 9; k += 2) {
            put('lantern', V.x - 1.4, V.y, V.z - k, 0);
            put('lantern', V.x + 1.4, V.y, V.z - k, 0);
        }
        // 广场角落花坛 + 村口栅栏
        for (const [hx, hz, ry] of [[-6.2, -6.2, 0], [6.2, -6.2, 0], [6.2, 6.2, 0], [-6.2, 6.2, 0]]) {
            put('hedge-large', V.x + hx, V.y, V.z + hz, ry);
        }
        for (let i = -12; i <= 12; i += 6) {
            put('fence', V.x + i, V.y, V.z + 14, Math.PI);
            put('fence', V.x + i, V.y, V.z - 14, 0);
        }
        // 水车（湖边）
        put('watermill', CFG.lake.x + CFG.lake.r * 0.92, CFG.waterLevel + 0.9, CFG.lake.z + 14, -0.6);
        // 码头
        for (let k = 0; k < 4; k++) put('planks', CFG.lake.x + CFG.lake.r * 0.86, CFG.waterLevel + 0.15, CFG.lake.z + 8 + k, 0);

        // 树木（树丛）
        const treeNames = ['tree-high', 'tree', 'tree-high-crooked'];
        const tp = groves(mulberry32(CFG.seed + 21), {
            groves: 70, perGrove: 14, region: { x: 0, z: 0, r: 210 }, avoid, spread: 15
        });
        tp.forEach((p, i) => {
            if (Q.trees < 1 && (i % Math.round(1 / Q.trees))) return;
            put(treeNames[(p.rx * treeNames.length) | 0], p.x, p.y - 0.1, p.z, p.ry, 0.7 + p.rz * 0.8);
        });
        // 岩石
        const rockNames = ['rock-large', 'rock-small', 'rock-wide'];
        const rp = scatter(mulberry32(CFG.seed + 33), 60, {
            minH: CFG.waterLevel - 0.5, maxSlope: 3, region: { x: 0, z: 0, r: 200 }, avoid
        });
        rp.forEach((p, i) => {
            if (Q.rocks < 1 && (i % Math.round(1 / Q.rocks))) return;
            put(rockNames[(p.rx * rockNames.length) | 0], p.x, p.y - 0.25, p.z, p.ry, 0.9 + p.rz * 1.4);
        });
        return P;
    }

    // ===================================================================
    // 模型加载 + 实例化
    // ===================================================================
    const MODELS = {
        'fantasy-town': ['tree', 'tree-high', 'tree-high-crooked', 'rock-large', 'rock-small', 'rock-wide',
            'hedge-large', 'fence', 'lantern', 'road', 'fountain-round', 'cart', 'stall', 'pillar-wood', 'planks', 'watermill'],
        'modular-buildings': ['building-sample-house-a', 'building-sample-house-b', 'building-sample-house-c']
    };

    function flatten(root) {
        const parts = [];
        root.updateMatrixWorld(true);
        root.traverse(o => { if (o.isMesh) parts.push({ geometry: o.geometry, material: o.material, local: o.matrixWorld.clone() }); });
        return parts;
    }

    function makeInstanced(parts, placements, castShadow) {
        const group = new THREE.Group();
        const m = new THREE.Matrix4(), q = new THREE.Quaternion(), s = new THREE.Vector3(), p = new THREE.Vector3();
        const up = new THREE.Vector3(0, 1, 0);
        for (const part of parts) {
            const im = new THREE.InstancedMesh(part.geometry, part.material, placements.length);
            placements.forEach((pl, i) => {
                p.set(pl.x, pl.y, pl.z);
                q.setFromAxisAngle(up, pl.ry);
                s.setScalar(pl.s);
                m.compose(p, q, s);
                m.multiply(part.local);
                im.setMatrixAt(i, m);
            });
            im.instanceMatrix.needsUpdate = true;
            im.castShadow = castShadow;
            im.receiveShadow = castShadow;
            group.add(im);
        }
        return group;
    }

    async function loadModels() {
        const manager = new THREE.LoadingManager();
        let total = 0, loaded = 0;
        manager.onStart = (u, n) => { total = n; };
        manager.onProgress = (u, n, t) => { loaded = n; total = t; setProgress(`加载模型 ${n}/${t}...`); };
        const loader = new GLTFLoader(manager);
        const scenes = {};
        const names = [];
        for (const kit in MODELS) for (const n of MODELS[kit]) names.push([kit, n]);
        let done = 0;
        await Promise.all(names.map(async ([kit, n]) => {
            const g = await loader.loadAsync(`${ASSETS}/models/${kit}/${n}.glb`);
            scenes[n] = g.scene;
            done++;
            setProgress(`加载模型 ${done}/${names.length}...`);
            return g;
        }));
        // 同一 kit 的 colormap 共享一张纹理，省显存
        for (const kit in MODELS) {
            let shared = null;
            for (const n of MODELS[kit]) {
                scenes[n].traverse(o => {
                    if (o.isMesh && o.material && o.material.map) {
                        if (!shared) shared = o.material.map;
                        else o.material.map = shared;
                        o.material.roughness = 0.92;
                        o.material.metalness = 0;
                    }
                });
            }
        }
        return scenes;
    }

    // ===================================================================
    // 组装
    // ===================================================================
    let controls = null, clock = null, frames = 0, frameTimeSum = 0, degraded = false;

    async function init() {
        setProgress('加载地形数据...');
        const hmSource = await loadHeightmap();
        console.log('heightmap source:', hmSource);

        setProgress('加载模型...');
        const scenes = await loadModels();

        setProgress('生成场景...');
        addSky();
        addLights();
        scene.fog = new THREE.Fog(SKY_HORIZON, 150, 460);

        const terrain = buildTerrain();
        scene.add(terrain);
        scene.add(buildWater());

        const placements = buildPlacements();
        const objectRoot = new THREE.Group();
        objectRoot.name = 'Objects';
        let drawGroups = 0;
        for (const name in placements) {
            const root = scenes[name];
            if (!root) continue;
            const parts = flatten(root);
            const cast = Q.shadows && !/^(road|planks)$/.test(name);
            objectRoot.add(makeInstanced(parts, placements[name], cast));
            drawGroups++;
        }
        scene.add(objectRoot);
        console.log('instanced groups:', drawGroups);

        // 相机与交互
        const c = new THREE.Vector3(V.x, V.y + 3, V.z);
        camera.position.set(V.x + 36, V.y + 21, V.z + 44);
        controls = new OrbitControls(camera, canvas);
        controls.target.copy(c);
        controls.enableDamping = true;
        controls.dampingFactor = 0.08;
        controls.minDistance = 12;
        controls.maxDistance = 320;
        controls.maxPolarAngle = Math.PI * 0.495;
        controls.autoRotate = true;
        controls.autoRotateSpeed = 0.35;
        ['pointerdown', 'wheel', 'touchstart'].forEach(ev =>
            canvas.addEventListener(ev, () => { controls.autoRotate = false; }, { once: true, passive: true })
        );
        controls.update();

        clock = new THREE.Clock();
        cover.style.display = 'none';
        setStatus('场景加载成功', 'ready');
        globalThis.__scene = scene;
        globalThis.__ready = true;
        requestAnimationFrame(animate);
    }

    function animate() {
        requestAnimationFrame(animate);
        const dt = clock ? Math.min(clock.getDelta(), 0.1) : 0;
        if (controls) controls.update();
        renderer.render(scene, camera);
        // 简易自动降级：连续帧率过低时关阴影、降像素比
        if (!degraded && controls) {
            frames++; frameTimeSum += dt;
            if (frames === 90) {
                const avg = frameTimeSum / frames * 1000;
                if (avg > 34) {
                    degraded = true;
                    if (renderer.shadowMap.enabled) { renderer.shadowMap.enabled = false; if (sun) sun.castShadow = false; }
                    renderer.setPixelRatio(Math.min(Q.pixelRatio, 1));
                    setStatus('已自动降低画质', 'ready');
                } else { frames = 0; frameTimeSum = 0; }
            }
        }
    }

    qualityEl.addEventListener('click', () => {
        tier = tier === 'low' ? 'high' : 'low';
        const url = new URL(location.href);
        url.searchParams.set('q', tier);
        location.href = url.toString();
    });

    init().catch(showError);
    </script>
</body>
