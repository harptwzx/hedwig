<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TSCN 3D 场景查看器（本地渲染）- Hedwig</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body {
            width: 100%; height: 100%;
            background: #0d1117;
            overflow: hidden;
            font-family: -apple-system, "Segoe UI", Roboto, "Microsoft YaHei", sans-serif;
        }
        #scene {
            position: absolute; inset: 0;
            width: 100%; height: 100%;
            display: block;
        }
        #hud {
            position: absolute; top: 0; left: 0; right: 0;
            display: flex; justify-content: space-between; align-items: center;
            padding: 10px 14px;
            pointer-events: none;
            z-index: 10;
        }
        #hud .info {
            color: #c9d1d9; font-size: 13px;
            background: rgba(13,17,23,.65);
            padding: 6px 12px; border-radius: 8px;
            backdrop-filter: blur(4px);
        }
        #hud .info a { color: #58a6ff; text-decoration: none; }
        #status { color: #8b949e; }
        #status.loading { color: #d29922; }
        #status.ready { color: #3fb950; }
        #status.error { color: #f85149; }
        #hint {
            position: absolute; right: 16px; bottom: 20px;
            color: #6e7681; font-size: 12px; text-align: right;
            z-index: 10; pointer-events: none; line-height: 1.8;
        }
        #cover {
            position: absolute; inset: 0;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            background: rgba(13,17,23,.92);
            z-index: 50; color: #c9d1d9;
            gap: 14px; text-align: center; padding: 20px;
        }
        #cover h1 { font-size: 22px; }
        #cover p { color: #8b949e; font-size: 14px; max-width: 420px; line-height: 1.8; }
        .spinner {
            width: 40px; height: 40px;
            border: 3px solid #30363d;
            border-top-color: #58a6ff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <canvas id="scene"></canvas>

    <div id="hud">
        <div class="info">
            <a href="/">← Hedwig</a>
        </div>
        <div class="info">
            <span id="status">加载中...</span>
        </div>
    </div>

    <div id="hint">
        鼠标拖动旋转视角<br>
        滚轮缩放 / 右键平移
    </div>

    <div id="cover">
        <h1>TSCN 3D 场景查看器</h1>
        <p>纯前端渲染版本，直接在您的浏览器中运行，无需服务器。</p>
        <div class="spinner"></div>
    </div>

    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
        }
    }
    </script>
    <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    const TSCN_URL = 'https://raw.githubusercontent.com/harptwzx/hedwig/main/tscn/godot/main.tscn';

    const statusEl = document.getElementById('status');
    const cover = document.getElementById('cover');

    function setStatus(text, cls) {
        statusEl.textContent = text;
        statusEl.className = cls || '';
    }

    // ========== 初始化 Three.js ==========
    const canvas = document.getElementById('scene');
    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x87a8cc);
    scene.fog = new THREE.Fog(0x87a8cc, 60, 200);
    scene.add(new THREE.HemisphereLight(0xdfeaff, 0x334455, 0.9));

    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 500);

    window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // ========== tscn 解析器 ==========
    function parseVec(text) {
        return (text.match(/-?\d+\.?\d*(e-?\d+)?/gi) || []).map(Number);
    }

    function parseTscn(text) {
        const subResources = {};
        const nodes = [];
        let cur = null;
        for (const raw of text.split('\n')) {
            const line = raw.trim();
            if (!line || line.startsWith(';') || line.startsWith('#')) continue;
            const sec = line.match(/^\[(.+)\]$/);
            if (sec) {
                const parts = sec[1].split(/\s+/);
                const attrs = {};
                for (let i = 1; i < parts.length; i++) {
                    const kv = parts[i].split('=');
                    if (kv.length >= 2) attrs[kv[0]] = kv.slice(1).join('=').replace(/^"|"$/g, '');
                }
                if (parts[0] === 'sub_resource') {
                    cur = { type: attrs.type, props: {} };
                    if (attrs.id) subResources[attrs.id] = cur;
                } else if (parts[0] === 'node') {
                    cur = { name: attrs.name || '', type: attrs.type || 'Node3D', parent: attrs.parent || '.', props: {} };
                    nodes.push(cur);
                } else {
                    cur = null;
                }
                continue;
            }
            if (!cur) continue;
            const eq = line.indexOf('=');
            if (eq < 0) continue;
            cur.props[line.slice(0, eq).trim()] = line.slice(eq + 1).trim();
        }
        return { subResources, nodes };
    }

    function applyTransform(obj, transformLine) {
        const n = parseVec(transformLine);
        if (n.length < 12) return;
        const m = new THREE.Matrix4();
        m.makeBasis(
            new THREE.Vector3(n[0], n[1], n[2]),
            new THREE.Vector3(n[3], n[4], n[5]),
            new THREE.Vector3(n[6], n[7], n[8])
        );
        m.setPosition(n[9], n[10], n[11]);
        m.decompose(obj.position, obj.quaternion, obj.scale);
    }

    function makeMaterial(props) {
        const colorText = props['albedo_color'] || props['albedo'];
        let color = 0x9aa0a6;
        if (colorText) {
            const n = parseVec(colorText);
            if (n.length >= 3) color = new THREE.Color(n[0], n[1], n[2]).getHex();
        }
        return new THREE.MeshStandardMaterial({ color, roughness: 0.85, metalness: 0.05 });
    }

    function meshGeometryFromSub(sub) {
        if (!sub) return null;
        const p = sub.props;
        switch (sub.type) {
            case 'PlaneMesh': {
                const n = parseVec(p['size'] || '1, 1');
                const g = new THREE.PlaneGeometry(n[0] || 1, n[1] || 1);
                g.rotateX(-Math.PI / 2);
                return g;
            }
            case 'BoxMesh': {
                const n = parseVec(p['size'] || '1, 1, 1');
                return new THREE.BoxGeometry(n[0] || 1, n[1] || 1, n[2] || 1);
            }
            case 'SphereMesh': {
                const r = parseVec(p['radius'] || '0.5')[0] || 0.5;
                return new THREE.SphereGeometry(r, 32, 24);
            }
            case 'CapsuleMesh': {
                const r = parseVec(p['radius'] || '0.5')[0] || 0.5;
                const h = parseVec(p['height'] || '2')[0] || 2;
                return new THREE.CapsuleGeometry(r, Math.max(0.01, h - 2 * r), 8, 16);
            }
            case 'CylinderMesh': {
                const t = parseVec(p['top_radius'] || '0.5')[0] || 0.5;
                const b = parseVec(p['bottom_radius'] || '0.5')[0] || 0.5;
                const h = parseVec(p['height'] || '2')[0] || 2;
                return new THREE.CylinderGeometry(t, b, h, 24);
            }
            default: return null;
        }
    }

    function buildScene(parsed) {
        const root = new THREE.Group();
        const byPath = { '.': root };

        for (const node of parsed.nodes) {
            const obj = new THREE.Group();
            obj.name = node.name;
            if (node.props['transform']) applyTransform(obj, node.props['transform']);

            const parentObj = byPath[node.parent] || root;
            parentObj.add(obj);
            byPath[(node.parent === '.' ? '' : node.parent) + '/' + node.name] = obj;

            switch (node.type) {
                case 'MeshInstance3D': {
                    const m = node.props['mesh'] && node.props['mesh'].match(/SubResource\("(.+?)"\)/);
                    const geo = meshGeometryFromSub(m ? parsed.subResources[m[1]] : null);
                    if (geo) {
                        const mesh = new THREE.Mesh(geo, makeMaterial(node.props));
                        mesh.castShadow = true;
                        mesh.receiveShadow = true;
                        obj.add(mesh);
                    }
                    break;
                }
                case 'DirectionalLight3D': {
                    const light = new THREE.DirectionalLight(0xffffff, 1.2);
                    const target = new THREE.Object3D();
                    obj.add(light); obj.add(target);
                    light.target = target;
                    light.position.set(0, 0, 0);
                    target.position.set(0, 0, -10);
                    light.castShadow = true;
                    light.shadow.camera.left = -25; light.shadow.camera.right = 25;
                    light.shadow.camera.top = 25; light.shadow.camera.bottom = -25;
                    break;
                }
                case 'OmniLight3D': {
                    const e = parseVec(node.props['light_energy'] || '1')[0] || 1;
                    const light = new THREE.PointLight(0xffffff, e * 30, 40);
                    obj.add(light);
                    break;
                }
                case 'SpotLight3D': {
                    const light = new THREE.SpotLight(0xffffff, 60, 40, Math.PI / 6);
                    obj.add(light);
                    break;
                }
                default: break;
            }
        }
        return root;
    }

    // ========== 加载并渲染 ==========
    let controls = null;

    async function init() {
        setStatus('加载场景...', 'loading');

        let root = null;
        try {
            const res = await fetch(TSCN_URL + '?t=' + Date.now());
            if (res.ok) {
                const parsed = parseTscn(await res.text());
                if (parsed.nodes.length > 0) {
                    root = buildScene(parsed);
                    setStatus('场景加载成功', 'ready');
                }
            }
        } catch (e) {
            console.error('加载失败:', e);
        }

        // 如果加载失败或场景为空，显示演示场景
        if (!root || root.children.length === 0) {
            root = new THREE.Group();
            const ground = new THREE.Mesh(
                new THREE.PlaneGeometry(40, 40).rotateX(-Math.PI / 2),
                new THREE.MeshStandardMaterial({ color: 0x4a7c59, roughness: 0.95 })
            );
            ground.receiveShadow = true;
            root.add(ground);
            const grid = new THREE.GridHelper(40, 40, 0x2f5233, 0x3a6b45);
            grid.position.y = 0.01;
            root.add(grid);
            if (!root.children.length) setStatus('使用演示场景', 'loading');
        }

        scene.add(root);

        // 自动取景
        const box = new THREE.Box3().setFromObject(root);
        const center = box.getCenter(new THREE.Vector3());
        const size = box.getSize(new THREE.Vector3());
        const radius = Math.max(size.x, size.y, size.z, 1);

        camera.position.set(
            center.x + radius * 0.9,
            center.y + radius * 0.7,
            center.z + radius * 0.9
        );

        controls = new OrbitControls(camera, canvas);
        controls.target.copy(center);
        controls.enableDamping = true;
        controls.dampingFactor = 0.08;
        controls.maxDistance = radius * 6;
        controls.minDistance = radius * 0.1;
        controls.update();

        // 隐藏加载遮罩
        cover.style.display = 'none';

        // 开始渲染循环
        animate();
    }

    function animate() {
        requestAnimationFrame(animate);
        if (controls) controls.update();
        renderer.render(scene, camera);
    }

    // 启动
    init().catch(err => {
        console.error(err);
        setStatus('加载失败: ' + err.message, 'error');
        cover.querySelector('.spinner').style.display = 'none';
    });
    </script>
</body>
</html>
