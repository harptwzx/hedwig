<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>地形场景查看器 - Hedwig</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body {
            width: 100%; height: 100%;
            background: #0d1117;
            overflow: hidden;
            font-family: -apple-system, "Segoe UI", Roboto, "Microsoft YaHei", sans-serif;
        }
        #scene {
            position: absolute; inset: 0;
            width: 100%; height: 100%;
            display: block;
        }
        #hud {
            position: absolute; top: 0; left: 0; right: 0;
            display: flex; justify-content: space-between; align-items: center;
            padding: 10px 14px;
            pointer-events: none;
            z-index: 10;
        }
        #hud .info {
            color: #c9d1d9; font-size: 13px;
            background: rgba(13,17,23,.65);
            padding: 6px 12px; border-radius: 8px;
            backdrop-filter: blur(4px);
        }
        #hud .info a { color: #58a6ff; text-decoration: none; pointer-events: auto; }
        #status { color: #8b949e; }
        #status.loading { color: #d29922; }
        #status.ready { color: #3fb950; }
        #status.error { color: #f85149; }
        #hint {
            position: absolute; right: 16px; bottom: 20px;
            color: rgba(255,255,255,.55); font-size: 12px; text-align: right;
            z-index: 10; pointer-events: none; line-height: 1.8;
            text-shadow: 0 1px 2px rgba(0,0,0,.4);
        }
        #cover {
            position: absolute; inset: 0;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            background: rgba(13,17,23,.92);
            z-index: 50; color: #c9d1d9;
            gap: 14px; text-align: center; padding: 20px;
        }
        #cover h1 { font-size: 22px; }
        #cover p { color: #8b949e; font-size: 14px; max-width: 420px; line-height: 1.8; }
        .spinner {
            width: 40px; height: 40px;
            border: 3px solid #30363d;
            border-top-color: #58a6ff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <canvas id="scene"></canvas>

    <div id="hud">
        <div class="info">
            <a href="/">← Hedwig</a>
        </div>
        <div class="info">
            <span id="status">加载中...</span>
        </div>
    </div>

    <div id="hint">
        鼠标拖动旋转视角<br>
        滚轮缩放 / 右键平移
    </div>

    <div id="cover">
        <h1>地形场景查看器</h1>
        <p>程序化山地地形（Terrain3D 演示风格），纯前端渲染，直接在您的浏览器中运行。</p>
        <div class="spinner"></div>
    </div>

    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
        }
    }
    </script>
    <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    const TSCN_URL = 'https://raw.githubusercontent.com/harptwzx/hedwig/main/tscn/godot/terrain.tscn';

    const statusEl = document.getElementById('status');
    const cover = document.getElementById('cover');

    function setStatus(text, cls) {
        statusEl.textContent = text;
        statusEl.className = cls || '';
    }

    // ========== 初始化 Three.js ==========
    const canvas = document.getElementById('scene');
    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.05;

    const scene = new THREE.Scene();

    const camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.1, 1200);

    window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // ========== tscn 解析器 ==========
    function parseVec(text) {
        return (text.match(/-?\d+\.?\d*(e-?\d+)?/gi) || []).map(Number);
    }

    function parseTscn(text) {
        const subResources = {};
        const nodes = [];
        let cur = null;
        for (const raw of text.split('\n')) {
            const line = raw.trim();
            if (!line || line.startsWith(';') || line.startsWith('#')) continue;
            const sec = line.match(/^\[(.+)\]$/);
            if (sec) {
                const parts = sec[1].split(/\s+/);
                const attrs = {};
                for (let i = 1; i < parts.length; i++) {
                    const kv = parts[i].split('=');
                    if (kv.length >= 2) attrs[kv[0]] = kv.slice(1).join('=').replace(/^"|"$/g, '');
                }
                if (parts[0] === 'sub_resource') {
                    cur = { kind: 'sub', type: attrs.type, props: {} };
                    if (attrs.id) subResources[attrs.id] = cur;
                } else if (parts[0] === 'node') {
                    cur = { kind: 'node', name: attrs.name || '', type: attrs.type || 'Node3D', parent: attrs.parent || '.', props: {} };
                    nodes.push(cur);
                } else {
                    cur = null;
                }
                continue;
            }
            if (!cur) continue;
            const eq = line.indexOf('=');
            if (eq < 0) continue;
            cur.props[line.slice(0, eq).trim()] = line.slice(eq + 1).trim();
        }
        return { subResources, nodes };
    }

    function applyTransform(obj, transformLine) {
        const n = parseVec(transformLine);
        if (n.length < 12) return;
        const m = new THREE.Matrix4();
        m.makeBasis(
            new THREE.Vector3(n[0], n[1], n[2]),
            new THREE.Vector3(n[3], n[4], n[5]),
            new THREE.Vector3(n[6], n[7], n[8])
        );
        m.setPosition(n[9], n[10], n[11]);
        m.decompose(obj.position, obj.quaternion, obj.scale);
    }

    function metaNum(node, key, dflt) {
        const v = node && node.props['metadata/' + key];
        if (v === undefined) return dflt;
        const n = parseFloat(v);
        return isNaN(n) ? dflt : n;
    }

    // ========== 确定性噪声（用于地形） ==========
    function hash2(ix, iz, seed) {
        let h = (ix * 374761393 + iz * 668265263 + seed * 5011) | 0;
        h = Math.imul(h ^ (h >>> 13), 1274126177);
        return ((h ^ (h >>> 16)) >>> 0) / 4294967296;
    }
    function smooth(t) { return t * t * (3 - 2 * t); }
    function valueNoise(x, z, seed) {
        const ix = Math.floor(x), iz = Math.floor(z);
        const fx = x - ix, fz = z - iz;
        const a = hash2(ix, iz, seed), b = hash2(ix + 1, iz, seed);
        const c = hash2(ix, iz + 1, seed), d = hash2(ix + 1, iz + 1, seed);
        const u = smooth(fx), v = smooth(fz);
        return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v;
    }
    function fbm(x, z, seed, octaves) {
        let sum = 0, amp = 0.5, freq = 1, norm = 0;
        for (let i = 0; i < octaves; i++) {
            sum += valueNoise(x * freq, z * freq, seed + i * 101) * amp;
            norm += amp; amp *= 0.5; freq *= 2.1;
        }
        return sum / norm;
    }
    function mulberry32(seed) {
        let s = seed >>> 0 || 1;
        return () => {
            s = (s + 0x6D2B79F5) | 0;
            let t = Math.imul(s ^ (s >>> 15), 1 | s);
            t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
            return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
        };
    }

    // ========== 天空穹顶（渐变 + 太阳） ==========
    function makeSky(skyTop, skyHorizon, sunDir) {
        const geo = new THREE.SphereGeometry(600, 32, 15);
        const mat = new THREE.ShaderMaterial({
            side: THREE.BackSide,
            depthWrite: false,
            uniforms: {
                topColor: { value: new THREE.Color(skyTop) },
                horizonColor: { value: new THREE.Color(skyHorizon) },
                sunDir: { value: sunDir.clone().normalize() },
                sunColor: { value: new THREE.Color(0xfff3d6) }
            },
            vertexShader: `
                varying vec3 vDir;
                void main() {
                    vDir = normalize(position);
                    gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
                }`,
            fragmentShader: `
                uniform vec3 topColor, horizonColor, sunColor, sunDir;
                varying vec3 vDir;
                void main() {
                    float h = clamp(vDir.y, 0.0, 1.0);
                    vec3 col = mix(horizonColor, topColor, pow(h, 0.55));
                    float s = max(dot(normalize(vDir), normalize(sunDir)), 0.0);
                    col += sunColor * (pow(s, 350.0) * 1.2 + pow(s, 8.0) * 0.18);
                    gl_FragColor = vec4(col, 1.0);
                }`
        });
        const sky = new THREE.Mesh(geo, mat);
        sky.name = 'SkyDome';
        return sky;
    }

    // ========== 程序化地形 ==========
    let terrainHeightAt = () => 0;

    function buildTerrain(cfg) {
        const size = cfg.size, amp = cfg.height, seed = cfg.seed;
        const segs = 200;
        const geo = new THREE.PlaneGeometry(size, size, segs, segs);
        geo.rotateX(-Math.PI / 2);

        const pos = geo.attributes.position;
        const freq = 2.6 / size;

        function heightAt(x, z) {
            // 山体 fbm + 中央抬升，边缘略降形成湖泊洼地
            let h = fbm(x * freq + 7.3, z * freq + 3.1, seed, 5);
            h = Math.pow(h, 1.6) * amp * 1.9;
            const d = Math.sqrt(x * x + z * z) / (size * 0.5);
            h += (1 - smooth(Math.min(d, 1))) * amp * 0.45;
            h -= Math.pow(Math.max(d - 0.55, 0) / 0.45, 2) * amp * 0.35;
            return h - amp * 0.28;
        }
        terrainHeightAt = heightAt;

        const colors = new Float32Array(pos.count * 3);
        const cSand = new THREE.Color(0xc7b489);
        const cGrass1 = new THREE.Color(0x4e7a38);
        const cGrass2 = new THREE.Color(0x7a9a4a);
        const cRock = new THREE.Color(0x7d7a72);
        const cSnow = new THREE.Color(0xeef1f4);
        const tmp = new THREE.Color();

        for (let i = 0; i < pos.count; i++) {
            const x = pos.getX(i), z = pos.getZ(i);
            const h = heightAt(x, z);
            pos.setY(i, h);

            // 坡度估计
            const e = 1.2;
            const slope = Math.max(
                Math.abs(heightAt(x + e, z) - h),
                Math.abs(heightAt(x, z + e) - h)
            ) / e;

            const w = cfg.waterLevel;
            const t = h / amp;
            const nmix = fbm(x * 0.08 + 11, z * 0.08 + 5, seed + 999, 3);

            if (h < w + 0.6) {
                tmp.copy(cSand);
            } else if (t > 0.72) {
                tmp.copy(cSnow);
            } else {
                tmp.copy(cGrass1).lerp(cGrass2, nmix);
                if (slope > 0.75) tmp.lerp(cRock, Math.min((slope - 0.75) * 2.2, 1));
                if (t > 0.55) tmp.lerp(cSnow, smooth((t - 0.55) / 0.17) * 0.8);
            }
            // 轻微随机色斑，避免纯色
            const jitter = 0.92 + hash2(Math.round(x * 3), Math.round(z * 3), seed + 7) * 0.16;
            colors[i * 3] = tmp.r * jitter;
            colors[i * 3 + 1] = tmp.g * jitter;
            colors[i * 3 + 2] = tmp.b * jitter;
        }
        geo.setAttribute('color', new THREE.BufferAttribute(colors, 3));
        geo.computeVertexNormals();

        const mat = new THREE.MeshStandardMaterial({
            vertexColors: true,
            roughness: 0.95,
            metalness: 0.0
        });
        const mesh = new THREE.Mesh(geo, mat);
        mesh.receiveShadow = true;
        mesh.castShadow = true;
        mesh.name = 'Terrain';
        return mesh;
    }

    // ========== 水面 ==========
    function buildWater(cfg) {
        const size = cfg.size * 1.6;
        const geo = new THREE.PlaneGeometry(size, size, 1, 1);
        geo.rotateX(-Math.PI / 2);
        const mat = new THREE.MeshStandardMaterial({
            color: 0x2b6d94,
            transparent: true,
            opacity: 0.78,
            roughness: 0.12,
            metalness: 0.35
        });
        const mesh = new THREE.Mesh(geo, mat);
        mesh.position.y = cfg.waterLevel;
        mesh.receiveShadow = true;
        mesh.name = 'Water';
        return mesh;
    }

    // ========== 植被与岩石散布 ==========
    function slopeAt(x, z) {
        const e = 1.2, h = terrainHeightAt(x, z);
        return Math.max(
            Math.abs(terrainHeightAt(x + e, z) - h),
            Math.abs(terrainHeightAt(x, z + e) - h)
        ) / e;
    }

    function scatterPositions(cfg, count, minH, maxH, maxSlope, rng) {
        const pts = [];
        const half = cfg.size * 0.46;
        let guard = count * 30;
        while (pts.length < count && guard-- > 0) {
            const x = (rng() * 2 - 1) * half;
            const z = (rng() * 2 - 1) * half;
            const h = terrainHeightAt(x, z);
            if (h < minH || h > maxH) continue;
            if (slopeAt(x, z) > maxSlope) continue;
            pts.push([x, h, z]);
        }
        return pts;
    }

    function buildTrees(cfg) {
        const rng = mulberry32(cfg.seed * 7919 + 13);
        const count = Math.max(0, Math.min(cfg.trees, 600));
        const treeLine = cfg.height * 0.72;
        const pts = scatterPositions(cfg, count, cfg.waterLevel + 0.8, treeLine, 0.85, rng);

        const group = new THREE.Group();
        group.name = 'Trees';

        const trunkGeo = new THREE.CylinderGeometry(0.14, 0.22, 1.4, 6);
        trunkGeo.translate(0, 0.7, 0);
        const trunkMat = new THREE.MeshStandardMaterial({ color: 0x6b4a2f, roughness: 0.9 });
        const trunks = new THREE.InstancedMesh(trunkGeo, trunkMat, pts.length);

        const folGeo = new THREE.ConeGeometry(1.1, 2.6, 7);
        folGeo.translate(0, 2.6, 0);
        const folMat = new THREE.MeshStandardMaterial({ roughness: 0.85 });
        const fols = new THREE.InstancedMesh(folGeo, folMat, pts.length);

        const m = new THREE.Matrix4(), q = new THREE.Quaternion(), s = new THREE.Vector3();
        const p = new THREE.Vector3(), up = new THREE.Vector3(0, 1, 0);
        const c1 = new THREE.Color(0x2f5d28), c2 = new THREE.Color(0x58823b), col = new THREE.Color();
        pts.forEach(([x, h, z], i) => {
            const scale = 0.8 + rng() * 0.9;
            p.set(x, h - 0.1, z);
            q.setFromAxisAngle(up, rng() * Math.PI * 2);
            s.setScalar(scale);
            m.compose(p, q, s);
            trunks.setMatrixAt(i, m);
            fols.setMatrixAt(i, m);
            fols.setColorAt(i, col.copy(c1).lerp(c2, rng()));
        });
        trunks.castShadow = true; fols.castShadow = true;
        group.add(trunks, fols);
        return group;
    }

    function buildRocks(cfg) {
        const rng = mulberry32(cfg.seed * 104729 + 31);
        const count = Math.max(0, Math.min(cfg.rocks, 400));
        const pts = scatterPositions(cfg, count, cfg.waterLevel - 0.5, cfg.height * 0.9, 2.5, rng);

        const geo = new THREE.DodecahedronGeometry(1, 0);
        const mat = new THREE.MeshStandardMaterial({ roughness: 0.92 });
        const rocks = new THREE.InstancedMesh(geo, mat, pts.length);
        rocks.name = 'Rocks';

        const m = new THREE.Matrix4(), q = new THREE.Quaternion(), s = new THREE.Vector3();
        const p = new THREE.Vector3(), euler = new THREE.Euler();
        const c1 = new THREE.Color(0x8a867c), c2 = new THREE.Color(0x5f5b52), col = new THREE.Color();
        pts.forEach(([x, h, z], i) => {
            const scale = 0.3 + rng() * 1.1;
            p.set(x, h - scale * 0.35, z);
            euler.set(rng() * 0.6, rng() * Math.PI * 2, rng() * 0.6);
            q.setFromEuler(euler);
            s.set(scale * (0.7 + rng() * 0.6), scale * (0.5 + rng() * 0.5), scale * (0.7 + rng() * 0.6));
            m.compose(p, q, s);
            rocks.setMatrixAt(i, m);
            rocks.setColorAt(i, col.copy(c1).lerp(c2, rng()));
        });
        rocks.castShadow = true;
        rocks.receiveShadow = true;
        return rocks;
    }

    // ========== tscn 中的额外节点（灯光 / 简单网格） ==========
    function meshGeometryFromSub(sub) {
        if (!sub) return null;
        const p = sub.props;
        switch (sub.type) {
            case 'PlaneMesh': {
                const n = parseVec(p['size'] || '1, 1');
                return new THREE.PlaneGeometry(n[0] || 1, n[1] || 1).rotateX(-Math.PI / 2);
            }
            case 'BoxMesh': {
                const n = parseVec(p['size'] || '1, 1, 1');
                return new THREE.BoxGeometry(n[0] || 1, n[1] || 1, n[2] || 1);
            }
            case 'SphereMesh': {
                const r = parseVec(p['radius'] || '0.5')[0] || 0.5;
                return new THREE.SphereGeometry(r, 32, 24);
            }
            case 'CapsuleMesh': {
                const r = parseVec(p['radius'] || '0.5')[0] || 0.5;
                const h = parseVec(p['height'] || '2')[0] || 2;
                return new THREE.CapsuleGeometry(r, Math.max(0.01, h - 2 * r), 8, 16);
            }
            case 'CylinderMesh': {
                const t = parseVec(p['top_radius'] || '0.5')[0] || 0.5;
                const b = parseVec(p['bottom_radius'] || '0.5')[0] || 0.5;
                const h = parseVec(p['height'] || '2')[0] || 2;
                return new THREE.CylinderGeometry(t, b, h, 24);
            }
            default: return null;
        }
    }

    // ========== 加载并组装场景 ==========
    let controls = null;
    let water = null;
    let autoRotate = true;
    let clock = null;

    function sunDirFrom(node) {
        const dir = new THREE.Vector3(0.6, 0.7, 0.55);
        if (node && node.props['transform']) {
            const holder = new THREE.Object3D();
            applyTransform(holder, node.props['transform']);
            // Godot 平行光朝本地 -Z 照射
            dir.set(0, 0, -1).applyQuaternion(holder.quaternion).multiplyScalar(-1);
        }
        if (dir.y < 0.15) dir.y = 0.15;
        return dir.normalize();
    }

    async function init() {
        setStatus('加载场景...', 'loading');

        let parsed = null;
        try {
            const res = await fetch(TSCN_URL + '?t=' + Date.now());
            if (res.ok) {
                parsed = parseTscn(await res.text());
            }
        } catch (e) {
            console.error('加载失败:', e);
        }

        // 从 tscn 中取参数，失败则用默认值
        const terrainNode = parsed && parsed.nodes.find(n => n.name === 'Terrain');
        const skySub = parsed && Object.values(parsed.subResources).find(s => s.type === 'ProceduralSkyMaterial');
        const lightNode = parsed && parsed.nodes.find(n => n.type === 'DirectionalLight3D');

        const cfg = {
            seed: metaNum(terrainNode, 'seed', 42),
            size: metaNum(terrainNode, 'size', 240),
            height: metaNum(terrainNode, 'height', 26),
            waterLevel: metaNum(terrainNode, 'water_level', 1.2),
            trees: metaNum(terrainNode, 'trees', 160),
            rocks: metaNum(terrainNode, 'rocks', 70)
        };

        let skyTop = 0x3875d1, skyHorizon = 0xb8d1eb;
        if (skySub) {
            const t = parseVec(skySub.props['sky_top_color'] || '');
            const h = parseVec(skySub.props['sky_horizon_color'] || '');
            if (t.length >= 3) skyTop = new THREE.Color(t[0], t[1], t[2]).getHex();
            if (h.length >= 3) skyHorizon = new THREE.Color(h[0], h[1], h[2]).getHex();
        }

        const sunDir = sunDirFrom(lightNode);

        // 天空 + 雾
        scene.add(makeSky(skyTop, skyHorizon, sunDir));
        scene.fog = new THREE.Fog(skyHorizon, cfg.size * 0.55, cfg.size * 1.4);
        scene.add(new THREE.HemisphereLight(0xcfe0f2, 0x3d4a38, 0.75));

        // 太阳
        const sun = new THREE.DirectionalLight(0xfff2dd, 2.4);
        sun.position.copy(sunDir).multiplyScalar(cfg.size * 0.6);
        sun.castShadow = true;
        const sc = cfg.size * 0.45;
        sun.shadow.camera.left = -sc; sun.shadow.camera.right = sc;
        sun.shadow.camera.top = sc; sun.shadow.camera.bottom = -sc;
        sun.shadow.camera.far = cfg.size * 2.5;
        sun.shadow.mapSize.set(2048, 2048);
        sun.shadow.bias = -0.0004;
        scene.add(sun, sun.target);

        // 地形 / 水面 / 植被 / 岩石
        scene.add(buildTerrain(cfg));
        water = buildWater(cfg);
        scene.add(water);
        scene.add(buildTrees(cfg));
        scene.add(buildRocks(cfg));

        // tscn 中其余的简单节点（如 Player 胶囊、点光源）
        if (parsed) {
            for (const node of parsed.nodes) {
                if (['Main', 'Terrain', 'WorldEnvironment'].includes(node.name)) continue;
                if (node.parent !== '.' && !/Player/.test(node.parent)) continue;
                if (node.type === 'MeshInstance3D') {
                    const m = node.props['mesh'] && node.props['mesh'].match(/SubResource\("(.+?)"\)/);
                    const geo = meshGeometryFromSub(m ? parsed.subResources[m[1]] : null);
                    if (geo) {
                        const mesh = new THREE.Mesh(geo, new THREE.MeshStandardMaterial({ color: 0xd05a4e, roughness: 0.6 }));
                        const holder = new THREE.Object3D();
                        const parentNode = parsed.nodes.find(n => n.name === node.parent.split('/').pop());
                        if (parentNode && parentNode.props['transform']) {
                            applyTransform(holder, parentNode.props['transform']);
                            const groundY = terrainHeightAt(holder.position.x, holder.position.z);
                            holder.position.y = Math.max(holder.position.y, groundY);
                        }
                        mesh.castShadow = true;
                        holder.add(mesh);
                        scene.add(holder);
                    }
                } else if (node.type === 'OmniLight3D') {
                    const holder = new THREE.Object3D();
                    if (node.props['transform']) applyTransform(holder, node.props['transform']);
                    const e = parseVec(node.props['light_energy'] || '1')[0] || 1;
                    holder.add(new THREE.PointLight(0xffffff, e * 30, 40));
                    scene.add(holder);
                }
            }
        }

        // 取景：从高处看向山谷
        const cx = 0, cz = 0;
        const cy = terrainHeightAt(cx, cz);
        const px = cfg.size * 0.32, pz = cfg.size * 0.3;
        camera.position.set(px, Math.max(terrainHeightAt(px, pz) + 14, cfg.height * 0.75), pz);
        controls = new OrbitControls(camera, canvas);
        controls.target.set(cx, cy + 4, cz);
        controls.enableDamping = true;
        controls.dampingFactor = 0.08;
        controls.maxDistance = cfg.size * 1.2;
        controls.minDistance = 2;
        controls.maxPolarAngle = Math.PI * 0.495;
        controls.autoRotate = true;
        controls.autoRotateSpeed = 0.5;
        ['pointerdown', 'wheel', 'touchstart'].forEach(ev =>
            canvas.addEventListener(ev, () => { controls.autoRotate = false; }, { once: true, passive: true })
        );
        controls.update();

        clock = new THREE.Clock();
        cover.style.display = 'none';
        setStatus('场景加载成功', 'ready');
        animate();
    }

    function animate() {
        requestAnimationFrame(animate);
        const t = clock ? clock.getElapsedTime() : 0;
        if (water) water.position.y += Math.sin(t * 0.8) * 0.0015;
        if (controls) controls.update();
        renderer.render(scene, camera);
    }

    init().catch(err => {
        console.error(err);
        setStatus('加载失败: ' + err.message, 'error');
        cover.querySelector('.spinner').style.display = 'none';
    });
    </script>
</body>
</html>
