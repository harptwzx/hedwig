<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TSCN 3D 场景查看器 - Hedwig</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body {
            width: 100%; height: 100%;
            background: #0d1117;
            overflow: hidden;
            font-family: -apple-system, "Segoe UI", Roboto, "Microsoft YaHei", sans-serif;
            touch-action: none;
            -webkit-user-select: none; user-select: none;
        }
        #viewCanvas {
            position: absolute; inset: 0;
            width: 100%; height: 100%;
            background: #000;
        }
        #hud {
            position: absolute; top: 0; left: 0; right: 0;
            display: flex; justify-content: space-between; align-items: center;
            padding: 10px 14px;
            pointer-events: none;
            z-index: 10;
        }
        #hud .info {
            color: #c9d1d9; font-size: 13px;
            background: rgba(13,17,23,.65);
            padding: 6px 12px; border-radius: 8px;
            backdrop-filter: blur(4px);
        }
        #hud .info a { color: #58a6ff; text-decoration: none; }
        #status { color: #8b949e; }
        #status.connected { color: #3fb950; }
        #status.error { color: #f85149; }

        #hint {
            position: absolute; right: 16px; bottom: 20px;
            color: #6e7681; font-size: 12px; text-align: right;
            z-index: 10; pointer-events: none; line-height: 1.8;
        }
        #cover {
            position: absolute; inset: 0;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            background: rgba(13,17,23,.92);
            z-index: 50; color: #c9d1d9;
            gap: 14px; text-align: center; padding: 20px;
        }
        #cover h1 { font-size: 22px; }
        #cover p { color: #8b949e; font-size: 14px; max-width: 420px; line-height: 1.8; }
        #connectBtn {
            background: #238636; color: #fff; border: none;
            padding: 12px 36px; font-size: 16px; border-radius: 8px;
            cursor: pointer;
        }
        #connectBtn:disabled { background: #30363d; cursor: default; }
        #serverInput {
            background: #161b22; border: 1px solid #30363d; color: #c9d1d9;
            padding: 10px 12px; border-radius: 8px; width: min(90vw, 380px);
            font-size: 14px; text-align: center;
        }
    </style>
</head>
<body>
    <canvas id="viewCanvas"></canvas>

    <div id="hud">
        <div class="info">
            <a href="/">← Hedwig</a>
        </div>
        <div class="info">
            <span id="status">未连接</span>
            <span id="fps" style="margin-left:10px;"></span>
        </div>
    </div>

    <div id="hint">
        鼠标拖动旋转视角<br>
        滚轮缩放 / 右键平移
    </div>

    <div id="cover">
        <h1>TSCN 3D 场景查看器</h1>
        <p>所有 3D 计算在服务器完成，此处仅显示画面。</p>
        <input id="serverInput" type="text" style="display:none;">
        <button id="connectBtn">连接服务器</button>
    </div>

    <script>
    (function () {
        var canvas = document.getElementById('viewCanvas');
        var ctx = canvas.getContext('2d');
        var statusEl = document.getElementById('status');
        var fpsEl = document.getElementById('fps');
        var cover = document.getElementById('cover');
        var connectBtn = document.getElementById('connectBtn');
        var serverInput = document.getElementById('serverInput');

        var ws = null;
        var img = new Image();
        var pendingFrame = false;
        var frameCount = 0, lastFpsTime = Date.now();

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        function setStatus(text, cls) {
            statusEl.textContent = text;
            statusEl.className = cls || '';
        }

        // ========== 绘制一帧 ==========
        img.onload = function () {
            pendingFrame = false;
            var cw = canvas.width, ch = canvas.height;
            var iw = img.width, ih = img.height;
            var scale = Math.min(cw / iw, ch / ih);
            var w = iw * scale, h = ih * scale;
            ctx.fillStyle = '#000';
            ctx.fillRect(0, 0, cw, ch);
            ctx.drawImage(img, (cw - w) / 2, (ch - h) / 2, w, h);
            frameCount++;
            var now = Date.now();
            if (now - lastFpsTime >= 1000) {
                fpsEl.textContent = frameCount + ' fps';
                frameCount = 0;
                lastFpsTime = now;
            }
        };

        // ========== WebSocket ==========
        function connect() {
            var url = serverInput.value.trim() ||
                (location.origin.replace(/^http/, 'ws') + '/tscn/ws');
            connectBtn.disabled = true;
            connectBtn.textContent = '连接中...';
            setStatus('连接中...', '');
            try { ws = new WebSocket(url); } catch (e) {
                setStatus('地址无效', 'error');
                connectBtn.disabled = false;
                connectBtn.textContent = '连接服务器';
                return;
            }
            ws.binaryType = 'blob';

            ws.onopen = function () {
                cover.style.display = 'none';
                setStatus('已连接', 'connected');
            };
            ws.onmessage = function (ev) {
                if (typeof ev.data === 'string') {
                    try {
                        var msg = JSON.parse(ev.data);
                        if (msg.type === 'frame' && !pendingFrame) {
                            pendingFrame = true;
                            img.src = 'data:image/jpeg;base64,' + msg.data;
                        } else if (msg.type === 'error') {
                            setStatus('错误: ' + msg.message, 'error');
                        }
                    } catch (e) {}
                    return;
                }
                if (!pendingFrame) {
                    pendingFrame = true;
                    var reader = new FileReader();
                    reader.onload = function () {
                        img.src = reader.result;
                    };
                    reader.readAsDataURL(ev.data);
                }
            };
            ws.onclose = function () {
                setStatus('已断开', 'error');
                cover.style.display = 'flex';
                connectBtn.disabled = false;
                connectBtn.textContent = '重新连接';
            };
            ws.onerror = function () {
                setStatus('连接错误', 'error');
                cover.style.display = 'flex';
                connectBtn.disabled = false;
                connectBtn.textContent = '重新连接';
            };
        }
        connectBtn.addEventListener('click', connect);
    })();
    </script>
</body>
</html>
