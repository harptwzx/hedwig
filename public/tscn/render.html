<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>TSCN Render</title>
    <style>
        html, body { margin: 0; padding: 0; width: 960px; height: 540px; overflow: hidden; background: #000; }
        #scene { display: block; width: 960px; height: 540px; }
    </style>
</head>
<body>
    <canvas id="scene"></canvas>
    <script type="module">
    // ============================================================
    // TSCN 渲染页 —— 运行在 Cloudflare 无头 Chromium 中（服务器端）
    // Durable Object 通过 CDP 调用：
    //   window.__setInput(x, y)  —— 设置移动输入（-1..1）
    //   window.__ready           —— 场景加载完成后置 true
    // ============================================================
    import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';

    const TSCN_URL = 'https://raw.githubusercontent.com/harptwzx/hedwig/main/tscn/godot/main.tscn';
    const MOVE_SPEED = 5.0;

    const canvas = document.getElementById('scene');
    const renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true });
    renderer.setSize(960, 540, false);

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x87a8cc);
    scene.fog = new THREE.Fog(0x87a8cc, 30, 90);

    // 光照（tscn 里的灯解析后追加）
    scene.add(new THREE.HemisphereLight(0xdfeaff, 0x334455, 0.9));

    const camera = new THREE.PerspectiveCamera(60, 960 / 540, 0.1, 200);

    // ========== 输入状态（由 __setInput 写入） ==========
    let input = { x: 0, y: 0 };
    window.__setInput = function (x, y) {
        input.x = Math.max(-1, Math.min(1, x || 0));
        input.y = Math.max(-1, Math.min(1, y || 0));
    };
    window.__ready = false;

    // ========== 角色与相机跟随 ==========
    let player = null;       // THREE.Group
    const camOffset = new THREE.Vector3(0, 6, 9);

    // ========== tscn 解析（支持常用节点子集） ==========
    function parseVec(text) {
        const nums = (text.match(/-?\d+\.?\d*(e-?\d+)?/gi) || []).map(Number);
        return nums;
    }

    function parseTscn(text) {
        const subResources = {};   // id -> {type, props}
        const nodes = [];          // {name, type, parent, props}
        let cur = null;
        for (const raw of text.split('\n')) {
            const line = raw.trim();
            if (!line || line.startsWith(';') || line.startsWith('#')) continue;
            const sec = line.match(/^\[(.+)\]$/);
            if (sec) {
                const parts = sec[1].split(/\s+/);
                const attrs = {};
                for (let i = 1; i < parts.length; i++) {
                    const kv = parts[i].split('=');
                    if (kv.length >= 2) attrs[kv[0]] = kv.slice(1).join('=').replace(/^"|"$/g, '');
                }
                if (parts[0] === 'sub_resource') {
                    cur = { type: attrs.type, props: {} };
                    if (attrs.id) subResources[attrs.id] = cur;
                } else if (parts[0] === 'node') {
                    cur = { name: attrs.name || '', type: attrs.type || 'Node3D', parent: attrs.parent || '.', props: {} };
                    nodes.push(cur);
                } else {
                    cur = null;
                }
                continue;
            }
            if (!cur) continue;
            const eq = line.indexOf('=');
            if (eq < 0) continue;
            cur.props[line.slice(0, eq).trim()] = line.slice(eq + 1).trim();
        }
        return { subResources, nodes };
    }

    // Transform3D(a,b,c, d,e,f, g,h,i, ox,oy,oz)：前 9 个数是三列基向量，后 3 个是原点
    function applyTransform(obj, transformLine) {
        const n = parseVec(transformLine);
        if (n.length < 12) return;
        const m = new THREE.Matrix4();
        m.makeBasis(
            new THREE.Vector3(n[0], n[1], n[2]),
            new THREE.Vector3(n[3], n[4], n[5]),
            new THREE.Vector3(n[6], n[7], n[8])
        );
        m.setPosition(n[9], n[10], n[11]);
        m.decompose(obj.position, obj.quaternion, obj.scale);
    }

    function makeMaterial(props) {
        const colorText = props['albedo_color'] || props['albedo'];
        let color = 0x9aa0a6;
        if (colorText) {
            const n = parseVec(colorText);
            if (n.length >= 3) color = new THREE.Color(n[0], n[1], n[2]).getHex();
        }
        return new THREE.MeshStandardMaterial({ color: color, roughness: 0.85, metalness: 0.05 });
    }

    function meshGeometryFromSub(sub) {
        if (!sub) return null;
        const p = sub.props;
        switch (sub.type) {
            case 'PlaneMesh': {
                const n = parseVec(p['size'] || '1, 1');
                const g = new THREE.PlaneGeometry(n[0] || 1, n[1] || 1);
                g.rotateX(-Math.PI / 2);   // Godot 平面朝 +Y
                return g;
            }
            case 'BoxMesh': {
                const n = parseVec(p['size'] || '1, 1, 1');
                return new THREE.BoxGeometry(n[0] || 1, n[1] || 1, n[2] || 1);
            }
            case 'SphereMesh': {
                const r = parseVec(p['radius'] || '0.5')[0] || 0.5;
                return new THREE.SphereGeometry(r, 32, 24);
            }
            case 'CapsuleMesh': {
                const r = parseVec(p['radius'] || '0.5')[0] || 0.5;
                const h = parseVec(p['height'] || '2')[0] || 2;
                return new THREE.CapsuleGeometry(r, Math.max(0.01, h - 2 * r), 8, 16);
            }
            case 'CylinderMesh': {
                const t = parseVec(p['top_radius'] || '0.5')[0] || 0.5;
                const b = parseVec(p['bottom_radius'] || '0.5')[0] || 0.5;
                const h = parseVec(p['height'] || '2')[0] || 2;
                return new THREE.CylinderGeometry(t, b, h, 24);
            }
            default:
                return null;
        }
    }

    // 返回 { root, player }：root 为场景根，player 为可移动角色（tscn 中名为 Player 的 CharacterBody3D）
    function buildScene(parsed) {
        const root = new THREE.Group();
        const byPath = { '.': root };
        let playerObj = null;

        for (const node of parsed.nodes) {
            const obj = new THREE.Group();
            obj.name = node.name;
            if (node.props['transform']) applyTransform(obj, node.props['transform']);

            const parentObj = byPath[node.parent] || root;
            parentObj.add(obj);
            byPath[(node.parent === '.' ? '' : node.parent) + '/' + node.name] = obj;

            switch (node.type) {
                case 'StaticBody3D':
                case 'CharacterBody3D':
                case 'Area3D':
                case 'Node3D':
                case 'Marker3D':
                    if (node.type === 'CharacterBody3D' && node.name === 'Player') playerObj = obj;
                    break;
                case 'MeshInstance3D': {
                    const m = node.props['mesh'] && node.props['mesh'].match(/SubResource\("(.+?)"\)/);
                    const geo = meshGeometryFromSub(m ? parsed.subResources[m[1]] : null);
                    if (geo) {
                        const mesh = new THREE.Mesh(geo, makeMaterial(node.props));
                        mesh.castShadow = true;
                        mesh.receiveShadow = true;
                        obj.add(mesh);
                    }
                    break;
                }
                case 'DirectionalLight3D': {
                    const light = new THREE.DirectionalLight(0xffffff, 1.2);
                    const target = new THREE.Object3D();
                    obj.add(light); obj.add(target);
                    light.target = target;
                    // 方向光从灯的 -Z 方向照出
                    light.position.set(0, 0, 0);
                    target.position.set(0, 0, -10);
                    light.castShadow = true;
                    light.shadow.camera.left = -25; light.shadow.camera.right = 25;
                    light.shadow.camera.top = 25; light.shadow.camera.bottom = -25;
                    break;
                }
                case 'OmniLight3D': {
                    const e = parseVec(node.props['light_energy'] || '1')[0] || 1;
                    const light = new THREE.PointLight(0xffffff, e * 30, 40);
                    obj.add(light);
                    break;
                }
                case 'SpotLight3D': {
                    const light = new THREE.SpotLight(0xffffff, 60, 40, Math.PI / 6);
                    obj.add(light);
                    break;
                }
                case 'Camera3D':
                    // 忽略 tscn 相机，统一用跟随相机
                    break;
                default:
                    break;
            }
        }
        return { root, player: playerObj };
    }

    // ========== 加载场景 ==========
    async function loadScene() {
        let parsed = null;
        try {
            const res = await fetch(TSCN_URL + '?t=' + Date.now());
            if (res.ok) parsed = parseTscn(await res.text());
        } catch (e) { /* 拉取失败则使用内置演示场景 */ }

        let root = null;
        if (parsed && parsed.nodes.length > 0) {
            const built = buildScene(parsed);
            root = built.root;
            player = built.player;
        }

        // 没有任何可用内容时：内置「3D 平地」演示
        if (!root || root.children.length === 0) {
            root = new THREE.Group();
            const ground = new THREE.Mesh(
                new THREE.PlaneGeometry(40, 40).rotateX(-Math.PI / 2),
                new THREE.MeshStandardMaterial({ color: 0x4a7c59, roughness: 0.95 })
            );
            ground.receiveShadow = true;
            root.add(ground);
            const grid = new THREE.GridHelper(40, 40, 0x2f5233, 0x3a6b45);
            grid.position.y = 0.01;
            root.add(grid);
        }

        // Player 不存在时补一个胶囊角色
        if (!player) {
            player = new THREE.Group();
            player.name = 'Player';
            const cap = new THREE.Mesh(
                new THREE.CapsuleGeometry(0.4, 0.8, 8, 16),
                new THREE.MeshStandardMaterial({ color: 0xc0392b, roughness: 0.6 })
            );
            cap.position.y = 0.8;
            cap.castShadow = true;
            player.add(cap);
            player.position.set(0, 0, 0);
            root.add(player);
        }

        // 给角色补影子
        player.traverse(function (o) { o.castShadow = true; });

        scene.add(root);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;

        camera.position.copy(player.position).add(camOffset);
        camera.lookAt(player.position);
    }

    // ========== 主循环：移动 + 相机跟随（全部在这里模拟） ==========
    let lastTime = performance.now();
    function tick() {
        const now = performance.now();
        const dt = Math.min((now - lastTime) / 1000, 0.1);
        lastTime = now;

        if (player) {
            const len = Math.hypot(input.x, input.y);
            if (len > 0.05) {
                // 相机参考系移动；y 为前后（摇杆上推为负）
                const dir = new THREE.Vector3(input.x, 0, input.y);
                if (len > 1) dir.divideScalar(len);
                player.position.addScaledVector(dir, MOVE_SPEED * dt);
                player.position.x = Math.max(-19, Math.min(19, player.position.x));
                player.position.z = Math.max(-19, Math.min(19, player.position.z));
            }
        }

        const camTarget = player ? player.position : new THREE.Vector3();
        const desired = camTarget.clone().add(camOffset);
        camera.position.lerp(desired, Math.min(dt * 5, 1));
        camera.lookAt(camTarget);

        renderer.render(scene, camera);
        requestAnimationFrame(tick);
    }

    loadScene().then(function () {
        window.__ready = true;
        requestAnimationFrame(tick);
    }).catch(function (e) {
        // 场景加载异常也要 ready，保证 DO 不卡住（显示空地）
        window.__ready = true;
        requestAnimationFrame(tick);
    });
    </script>
</body>
</html>
